# Builds the plugin and publishes a release with the plugin zip and a manifest.json
# that Jellyfin can use as a plugin repository.
# Run it from the Actions tab ("Run workflow", enter a version like 1.0.1), or push a tag like v1.0.1.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.0.1" >&2
            exit 1
          fi
          VERSION="${TAG#v}.0"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish Jellyfin.Plugin.AnnouncementBanner -c Release -o publish \
            -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Package
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ZIP="announcement-banner_${VERSION}.zip"

          mkdir pkg
          cp publish/Jellyfin.Plugin.AnnouncementBanner.dll pkg/
          jq --arg v "$VERSION" --arg t "$TIMESTAMP" '.version = $v | .timestamp = $t' meta.json > pkg/meta.json
          (cd pkg && zip -q "../$ZIP" ./*)

          # Jellyfin verifies the download against this MD5.
          CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          jq --arg v "$VERSION" --arg t "$TIMESTAMP" --arg url "$URL" --arg sum "$CHECKSUM" '[{
              guid, name, description, overview, owner, category,
              versions: [{ version: $v, changelog, targetAbi, sourceUrl: $url, checksum: $sum, timestamp: $t }]
            }]' meta.json > manifest.json

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          cat manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag too when run from the Actions tab.
          gh release create "$TAG" "$ZIP" manifest.json --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$(jq -r .changelog meta.json)"
